<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- Omnious mark V "The Astrolabe", animated.
       Outer orbit (3 arcs) turns clockwise in 40s; middle orbit (2 arcs)
       counter-rotates in 26s; the inner ring and driftwood core hold still.
       Stately instrument mechanics: linear, continuous, nothing bounces.
       Honors prefers-reduced-motion with the static composition.
       Classes/keyframes are namespaced: the <style> is document-global when
       this SVG is inlined in a component. -->
  <style>
    .omnious-astrolabe__outer, .omnious-astrolabe__middle {
      transform-box: view-box; transform-origin: 50% 50%;
    }
    .omnious-astrolabe__outer  { animation: omnious-astrolabe-spin-outer 40s linear infinite; }
    .omnious-astrolabe__middle { animation: omnious-astrolabe-spin-middle 26s linear infinite; }
    @keyframes omnious-astrolabe-spin-outer  { from { transform: rotate(18deg); }  to { transform: rotate(378deg); } }
    @keyframes omnious-astrolabe-spin-middle { from { transform: rotate(-52deg); } to { transform: rotate(-412deg); } }
    @media (prefers-reduced-motion: reduce) {
      .omnious-astrolabe__outer, .omnious-astrolabe__middle { animation: none; }
      .omnious-astrolabe__outer  { transform: rotate(18deg); }
      .omnious-astrolabe__middle { transform: rotate(-52deg); }
    }
  </style>
  <g fill="none" stroke-linecap="round">
    <circle class="omnious-astrolabe__outer" cx="72" cy="72" r="56" stroke="#6c6a64" stroke-width="3.5"
            pathLength="100" stroke-dasharray="27.3 6.03"/>
    <circle class="omnious-astrolabe__middle" cx="72" cy="72" r="40" stroke="#a3a19a" stroke-width="5.5"
            pathLength="100" stroke-dasharray="42.5 7.5"/>
    <circle cx="72" cy="72" r="24" stroke="#e6e4df" stroke-width="8"/>
  </g>
  <circle cx="72" cy="72" r="8.5" fill="#a98e6f"/>
</svg>
